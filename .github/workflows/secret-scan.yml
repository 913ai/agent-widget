name: Security - Secret Scan (gitleaks)

# Secret PREVENTION/detection with gitleaks (free binary; no org license needed when run directly).
# The real win is catching secrets BEFORE they enter git history. Use the pre-commit hook
# (.pre-commit-config.yaml) locally for prevention, and this CI job as the backstop on PRs +
# a weekly full-history scan.
#
# This is especially relevant for agent-widget: cdn.js is a public embeddable bundle, so any
# API key / token accidentally inlined into it would ship straight to customers' browsers.
#
# GitHub-native secret scanning + push protection would also do this, but on PRIVATE repos that
# requires paid GitHub Advanced Security — gitleaks gives us the same outcome for free.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scheduled scan covers past commits

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan (PR = diff since base, scheduled = full history)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gitleaks detect --source . --redact --no-banner \
              --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
              --report-format sarif --report-path gitleaks.sarif || EXIT=$?
          else
            gitleaks detect --source . --redact --no-banner \
              --report-format sarif --report-path gitleaks.sarif || EXIT=$?
          fi
          if [ "${EXIT:-0}" != "0" ]; then
            echo "::error::gitleaks found potential secrets. Rotate the secret immediately, then remove it from history."
            exit 1
          fi

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30
          if-no-files-found: ignore
